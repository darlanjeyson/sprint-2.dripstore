<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra</title>
</head>
<body>
    <img src="./img/image.png" alt="logo Digital College">
    <nav>
        <li>
            Home
        </li>
        <li>
            Produtos
        </li>
        <li>
            Categorias
        </li>
        <li>
            Meus Pedidos
        </li>
    </nav>

    <h1>Finalizar Compra</h1>

    <Form>
        <p>Informações Pessoais</p>
            <label>Nome Completo*</label>
                <input type="text" placeholder="Digite seu Nome">
            <label>CPF*</label>
                <input type="number" placeholder="Digite seu CPF">
            <label>E-mail*</label>
                <input type="email" placeholder="Digite seu email">
            <label>Celular*</label>
                <input type="number" placeholder="Insira seu celular">
         <p>Informações de Entrega</p>
            <label>Endereço*</label>
                <input type="text" placeholder="Insira seu endereço">
            <label>Bairro*</label>
                <input type="text" placeholder="Insira seu bairro">
            <label>Cidade*</label>
                <input type="text" placeholder="Insira sua cidade">
            <label>CEP*</label>
                <input type="text" placeholder="Insira seu CEP">
            <label>Complemento*</label>
                <input type="text" placeholder="Insira complemento">
        <p>Informações de Pagamento</p>
            <p>Forma de Pagamento</p>
                <input type="radio" id="cartaoDeCredito" name="pagamento" value="a">
            <label for="cartaoDeCredito">Cartão de Crédito</label>
                <input type="radio" id="boletoBancario" name="pagamento" value="b">
            <label for="boletoBancario">Boleto Bancário</label>
            <label>Nome do Cartão*</label>
                <input type="text" placeholder="Insira o nome do Cartão">
            <label>Número do Cartão*</label>
                <input type="number" placeholder="Insira o número do cartão">
            <label>CVV*</label>
                <input type="number" placeholder="CVV*">
            <label>Data de validade do Cartão</label>
                <input type="number" placeholder="Insira a validade do cartão">

    </Form> 
</body>
</html>
